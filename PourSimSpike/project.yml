name: PourSimSpike
options:
  bundleIdPrefix: com.macfaldet
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"

settings:
  base:
    SWIFT_VERSION: 5.9
    ENABLE_PREVIEWS: NO
    # Metal shaders need this off for consistent precision
    MTL_FAST_MATH: NO

targets:
  PourSimSpike:
    type: application
    platform: iOS
    sources:
      - path: PourSimSpike
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macfaldet.PourSimSpike
        INFOPLIST_FILE: PourSimSpike/Info.plist
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        SUPPORTED_PLATFORMS: iphoneos
    info:
      path: PourSimSpike/Info.plist
      properties:
        CFBundleName: PourSimSpike
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMotionUsageDescription: "Tilt your device to control paint flow."
